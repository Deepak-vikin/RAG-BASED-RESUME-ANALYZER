services:
  - type: web
    name: document-analyzer-api
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: FRONTEND_ORIGIN
        value: https://*.vercel.app
      - key: DATA_DIR
        value: ./data
    # For Render paid instances with Persistent Disk support:
    # disk:
    #   name: document-storage
    #   mountPath: /var/data
    #   sizeGB: 5

